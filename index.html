<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>秘書</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2a44">
<style>
  :root {
    --navy: #0f2a44; --sea: #1f6f9f; --bg: #f3f6f9; --card: #fff; --ink: #1b2733; --mute: #6b7a89;
    --up: #1c8a5a; --down: #c2453d; --line: #e3e9ef; --me: #1f6f9f; --her: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b1622; --card: #13212f; --ink: #e6edf3; --mute: #8fa1b3; --line: #22344a; --sea: #5aa9d6; --me: #2b6f9a; --her: #13212f; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; display: flex; flex-direction: column; }
  header { background: var(--navy); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 0; flex: none; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .top h1 { margin: 0; font-size: 19px; }
  .top .sub { font-size: 12px; opacity: .75; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5bd18b; margin-right: 4px; }
  .dot.off { background: #f0b429; }
  nav { display: flex; margin-top: 8px; }
  nav button { flex: 1; background: none; color: rgba(255,255,255,.65); border: 0; border-bottom: 3px solid transparent; padding: 8px 0 9px; font: inherit; font-weight: 600; border-radius: 0; }
  nav button.on { color: #fff; border-bottom-color: #fff; }
  nav button.unread::after { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff5a4f; margin-left: 5px; vertical-align: 6px; }
  .view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pad { padding: 14px 16px 24px; max-width: 600px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--mute); font-weight: 600; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat .v { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 13px; color: var(--mute); }
  .stat .d { font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .item { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item .meta { font-size: 12px; color: var(--mute); }
  .item a { color: var(--sea); text-decoration: none; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #fde8e6; color: var(--down); margin-left: 6px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; background: var(--sea); color: #fff; width: 100%; font-weight: 600; }
  button.ghost { background: transparent; color: var(--sea); border: 1px solid var(--line); }
  input, textarea { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .offline { background: #fff4d6; color: #7a5a00; border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 14px; }
  .hint { font-size: 13px; color: var(--mute); margin: 8px 0 0; }
  .hidden { display: none !important; }
  .row { display: flex; gap: 10px; }

  #msgs { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .msg.secretary { align-self: flex-start; background: var(--her); border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .msg a { color: inherit; }
  .msg.notice { border-left: 3px solid #e0a53a; }
  .msg .tag { display: block; font-size: 12px; color: #b07a12; margin-bottom: 2px; }
  .msg time { display: block; font-size: 11px; opacity: .6; margin-top: 3px; }
  .typing { align-self: flex-start; color: var(--mute); font-size: 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 0; flex: none; }
  .chips button { width: auto; flex: none; padding: 6px 12px; border-radius: 16px; font-size: 14px; font-weight: 500; background: var(--card); color: var(--sea); border: 1px solid var(--line); }
  .composer { flex: none; display: flex; gap: 8px; padding: 8px 16px calc(env(safe-area-inset-bottom) + 8px); background: var(--bg); align-items: flex-end; }
  .composer textarea { resize: none; max-height: 120px; min-height: 42px; }
  .composer button { width: auto; padding: 10px 16px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icon-192-v2.png" alt="">
    <div>
      <h1>秘書</h1>
      <div class="sub" id="status"><span class="dot"></span>連線中</div>
    </div>
  </div>
  <nav id="tabs" class="hidden">
    <button data-tab="chat" class="on">對話</button>
    <button data-tab="report">粉專報告</button>
  </nav>
</header>

<section id="login" class="view">
  <div class="pad">
    <div class="card">
      <h2>第一次使用，請輸入密碼</h2>
      <input id="pw" type="password" autocomplete="current-password" placeholder="App 密碼">
      <div style="height:10px"></div>
      <button id="loginBtn">登入</button>
      <p class="hint" id="loginMsg"></p>
    </div>
  </div>
</section>

<section id="chat" class="view hidden">
  <div class="pad">
    <div id="notifyCard" class="card hidden">
      <h2>開啟通知</h2>
      <button id="notifyBtn">允許秘書傳通知給我</button>
      <p class="hint" id="notifyMsg"></p>
    </div>
    <div id="msgs"></div>
  </div>
</section>
<div id="chips" class="chips hidden">
  <button>今天行程</button>
  <button>明天行程</button>
  <button>摘要今天的郵件</button>
  <button>這週有什麼重要的事</button>
</div>
<div id="composer" class="composer hidden">
  <textarea id="input" rows="1" placeholder="交代秘書…"></textarea>
  <button id="sendBtn">送出</button>
</div>

<section id="report" class="view hidden">
  <div class="pad">
    <div id="offline" class="offline hidden">秘書離線中（電腦可能關機），顯示的是上次的報告</div>
    <div class="card">
      <h2 id="pageTitle">蘭尼斯特號 近 7 天</h2>
      <div class="stats" id="stats"></div>
      <p class="hint" id="updated"></p>
    </div>
    <div class="card">
      <h2>留言 <span id="unrepliedBadge"></span></h2>
      <div id="comments"></div>
    </div>
    <div class="card">
      <h2>最近貼文</h2>
      <div id="posts"></div>
    </div>
    <div class="row">
      <button class="ghost" id="refreshBtn">重新整理</button>
      <button class="ghost" id="testBtn">測試通知</button>
    </div>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>
